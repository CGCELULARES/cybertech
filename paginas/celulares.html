
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de celulares CyberTech Store">
    <title>Celulares | CyberTech Store</title>

    <script>
        tailwind = window.tailwind || {};
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0a0a0c',
                            card: '#121217',
                            border: '#272732',
                            red: '#ef4444'
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col">

    <header class="w-full border-b border-gray-800 bg-[#0a0a0a]/95 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
            <a href="./index.html" class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-red-600 flex items-center justify-center">
                    <i class="fa-solid fa-mobile-screen-button text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-xl">
                        CyberTech <span class="text-red-500">Store</span>
                    </h1>
                    <p class="text-gray-500 text-xs">Tecnologia e inovação</p>
                </div>
            </a>

            <nav class="hidden md:flex items-center gap-8">
                <a href="./index.html" class="text-gray-300 hover:text-red-500 transition">Início</a>
                <a href="./celulares.html" class="text-red-500 font-bold">Celulares</a>
            </nav>

            <a href="./index.html" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-xl text-sm font-bold">
                <i class="fa-solid fa-arrow-left mr-2"></i>
                Voltar
            </a>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto px-4 py-10 w-full">
        <section class="mb-10">
            <span class="text-red-500 text-xs font-bold uppercase tracking-widest">Catálogo oficial</span>
            <h2 class="text-3xl md:text-4xl font-extrabold mt-2">
                Nossos <span class="text-red-500">Celulares</span>
            </h2>
            <p class="text-gray-400 mt-3">Confira nossos aparelhos disponíveis.</p>
        </section>

        <section class="mb-8">
            <div class="relative max-w-xl">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-500"></i>
                <input type="text" id="searchInput"
                    placeholder="Pesquisar iPhone, Xiaomi, POCO..."
                    oninput="filterProducts()"
                    class="w-full bg-[#15151c] border border-gray-800 rounded-xl py-4 pl-12 pr-4 text-white outline-none focus:border-red-500">
            </div>
        </section>

        <section class="flex flex-wrap gap-3 mb-8">
            <button type="button"
                class="cat-btn active bg-red-600 text-white px-5 py-2 rounded-xl font-bold"
                onclick="filterCategory('all', this)">
                Todos
            </button>
            <button type="button"
                class="cat-btn bg-[#15151c] border border-gray-800 px-5 py-2 rounded-xl"
                onclick="filterCategory('celular', this)">
                Celulares
            </button>
        </section>

        <section class="mb-5">
            <p class="text-gray-400 text-sm">
                <i class="fa-solid fa-mobile-screen-button text-red-500 mr-2"></i>
                Catálogo de aparelhos
            </p>
        </section>

        <section id="productGrid" class="product-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-16">
                <i class="fa-solid fa-spinner fa-spin text-red-500 text-3xl"></i>
                <p class="text-gray-400 mt-4">Carregando celulares...</p>
            </div>
        </section>
    </main>

    <footer class="border-t border-gray-800 mt-20 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h3 class="font-bold text-lg">CyberTech <span class="text-red-500">Store</span></h3>
            <p class="text-gray-500 text-sm mt-2">© 2026 CyberTech Store. Todos os direitos reservados.</p>
        </div>
    </footer>

<script type="module" src="/js/script.js"></script>
</body>
</html>
